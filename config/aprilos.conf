# ===== AprilOS build configuration =====
OS_NAME="AprilOS"
OS_ID="aprilos"
OS_VERSION="0.1"
OS_CODENAME="blossom"

# repo บน GitHub ที่ใช้เป็นแหล่งอัปเดต (owner/repo)
GITHUB_REPO="AImunich20/AprilOS"

# ฐาน Ubuntu ที่ใช้ (noble = 24.04 LTS, เปลี่ยนเป็น LTS ใหม่กว่าได้)
UBUNTU_CODENAME="noble"
ARCH="${ARCH:-amd64}"                               # amd64 หรือ arm64 (override ได้: ARCH=arm64 ./build.sh)
if [ "$ARCH" = "amd64" ]; then
    UBUNTU_MIRROR="http://archive.ubuntu.com/ubuntu"
else
    UBUNTU_MIRROR="http://ports.ubuntu.com/ubuntu-ports"
fi

LIVE_USER="april"
HOSTNAME="aprilos"
TIMEZONE="Asia/Bangkok"
LOCALE="en_US.UTF-8"
EXTRA_LOCALES="th_TH.UTF-8"
