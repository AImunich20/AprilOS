[greeter]
background=/usr/share/backgrounds/aprilos/aprilos-waves.svg
user-background=false
theme-name=WhiteSur-Dark
icon-theme-name=WhiteSur-dark
cursor-theme-name=WhiteSur-cursors
cursor-theme-size=24
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=none
default-user-image=#avatar-default
round-user-image=true
position=50%,center 45%,center
panel-position=top
indicators=~host;~spacer;~clock;~spacer;~language;~a11y;~power
clock-format=%a %-d %b  %H:%M
